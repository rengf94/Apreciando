<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#lensGrad)"/>
  <!-- Lupa de joyero -->
  <circle cx="42" cy="42" r="18" fill="none" stroke="white" stroke-width="4"/>
  <line x1="55" y1="55" x2="72" y2="72" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Símbolo $ dentro de la lupa -->
  <text x="42" y="50" font-size="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold">$</text>
</svg>
